name: Daily Owner Summary

on:
  workflow_dispatch:

  # Temporary schedule for testing.
  # Runs every five minutes, starting at minute 2.
  schedule:
    - cron: "2/5 * * * *"

permissions:
  contents: read

jobs:
  daily-summary:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Generate and send daily summary
        env:
          COCOON_WEBHOOK_URL: ${{ secrets.COCOON_WEBHOOK_URL }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USERNAME: ${{ secrets.SMTP_USERNAME }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          REPORT_TO: ${{ secrets.REPORT_TO }}
        run: python scripts/daily-summary.py

      - name: Notify owner if automation fails
        if: failure()
        env:
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USERNAME: ${{ secrets.SMTP_USERNAME }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          REPORT_TO: ${{ secrets.REPORT_TO }}
        run: |
          python - <<'PY'
          import os
          import smtplib
          import ssl
          from email.message import EmailMessage

          msg = EmailMessage()
          msg["From"] = os.environ["SMTP_USERNAME"]
          msg["To"] = os.environ["REPORT_TO"]
          msg["Subject"] = "ALERT: Quote Desk automation failed"
          msg.set_content(
              "The daily summary workflow failed. "
              "Please check the GitHub Actions run history."
          )

          host = os.environ.get("SMTP_HOST", "smtp.gmail.com")
          port = int(os.environ.get("SMTP_PORT", "465"))

          if port == 465:
              with smtplib.SMTP_SSL(
                  host, port,
                  context=ssl.create_default_context()
              ) as server:
                  server.login(
                      os.environ["SMTP_USERNAME"],
                      os.environ["SMTP_PASSWORD"]
                  )
                  server.send_message(msg)
          else:
              with smtplib.SMTP(host, port) as server:
                  server.starttls()
                  server.login(
                      os.environ["SMTP_USERNAME"],
                      os.environ["SMTP_PASSWORD"]
                  )
                  server.send_message(msg)

          print("Failure alert sent.")
          PY
