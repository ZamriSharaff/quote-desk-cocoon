name: Build Desktop Applications

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  build:
    name: Build on ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        os:
          - windows-latest
          - macos-latest
          - ubuntu-24.04

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build with Pake
        id: pake
        uses: tw93/Pake@v3
        with:
          url: "https://quote-desk-cocoon.pages.dev"
          name: "Lakeside Quotes"
          icon: "assets/lakeside-quotes-icon.png"
          width: "1280"
          height: "900"

      - name: Upload desktop package
        uses: actions/upload-artifact@v4
        with:
          name: LakesideQuotes-${{ matrix.os }}
          path: ${{ steps.pake.outputs.package-path }}
          if-no-files-found: error
          